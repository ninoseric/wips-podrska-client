[package]
name = "lagani-proba"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
log = "0.4"
hbb_common = { path = "stub-hbb" }
arboard = { version = "=3.4.1", default-features = false }
winapi = { version = "0.3", features = ["winuser", "wingdi", "libloaderapi", "processthreadsapi", "sysinfoapi", "shellapi", "windef", "minwindef"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

# Samostalan projekt, nije član RustDesk workspacea.
[workspace]
