# WiPS Udaljena Korisnicka Podrska - Windows x64 build.
# Skraćena kopija job-a build-for-windows-flutter (x86_64) iz upstream
# .github/workflows/flutter-build.yml (RustDesk 1.5.1). Izostavljeno: arm64, testovi, MSI,
# printer driver, update metadata.
#
# Potpisivanje (Azure Artifact Signing, isti account kao WiPS.ERP; ADR 0005) se preskače dok repo nema
# varijablu ARTIFACT_SIGNING_ACCOUNT. Kao upstream: potpišu se datoteke u buildu prije pakiranja, pa
# instalacijski exe. Jednokratno postavljanje:
#   1. Na istoj App registration kao za WiPS.ERP dodati Federated credential → GitHub Actions:
#      organizacija ninoseric, repo wips-podrska-client, entity type Environment, naziv „release”.
#   2. Settings → Secrets and variables → Actions → Variables (to nisu tajne): AZURE_CLIENT_ID,
#      AZURE_TENANT_ID, ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE.
name: WiPS build (Windows x64)

on:
  workflow_dispatch:
    inputs:
      apply_patches:
        description: "Primijeni WiPS patcheve (false = nepromijenjeni upstream, za dijagnostiku)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

env:
  RUST_VERSION: "1.75"
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  OUT_NAME: ${{ (github.event_name == 'workflow_dispatch' && !inputs.apply_patches) && 'rustdesk-upstream' || 'WiPSPodrska' }}

permissions:
  contents: read

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows-x64:
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    environment: release # uz ovaj environment vezan je federated credential u Azureu
    permissions:
      contents: read
      id-token: write # OIDC prijava u Azure
    env:
      POTPIS: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply WiPS patches
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.apply_patches }}
        shell: bash
        run: bash wips/apply-patches.sh

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # virtualni zaslon (kao upstream)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Popis datoteka za potpis (nepotpisani .exe/.dll u buildu)
        if: env.POTPIS == 'true'
        shell: pwsh
        run: |
          # Potpisuje se samo ono što nema potpis. Sve to gradi ovaj workflow iz izvornog koda (osim gotovog
          # RustDesk flutter enginea), a isto potpisuje i upstream. Već potpisane datoteke zadržavaju potpis autora;
          # drajver usbmmidd_v2 (.sys/.cat) se ne dira — kernel drajvere Artifact Signing ne potpisuje.
          $popis = Get-ChildItem rustdesk -Recurse -File -Include '*.exe', '*.dll' |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -eq 'NotSigned' } |
            ForEach-Object { [IO.Path]::GetRelativePath($PWD.Path, $_.FullName) }
          if (-not $popis) { Write-Error "U rustdesk\ nema nepotpisanih .exe/.dll — build nije dao što se očekuje."; exit 1 }
          $popis | Set-Content potpis-popis.txt
          $popis | ForEach-Object { Write-Host $_ }

      - name: Prijava u Azure (OIDC, bez tajni)
        if: env.POTPIS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Potpis datoteka u buildu
        if: env.POTPIS == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-catalog: ${{ github.workspace }}\potpis-popis.txt
          # Bez vremenskog žiga potpis prestaje vrijediti s certifikatom, a on traje oko 3 dana.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./out
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          mv ./target/release/rustdesk-portable-packer.exe "./out/${OUT_NAME}-${ver}-x86_64.exe"
          (cd out && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS)

      # Ponovna prijava: OIDC token kojim se Azure prijava obnavlja vrijedi kratko, a pakiranje između potraje.
      - name: Prijava u Azure za potpis instalacijskog exe-a
        if: env.POTPIS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Potpis instalacijskog exe-a
        if: env.POTPIS == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Provjera potpisa i vremenskog žiga
        if: env.POTPIS == 'true'
        shell: pwsh
        run: |
          $datoteke = @(Get-Content potpis-popis.txt) + @(Get-ChildItem out -Filter *.exe | ForEach-Object FullName)
          $lose = $datoteke | ForEach-Object { Get-AuthenticodeSignature $_ } |
            Where-Object { $_.Status -ne 'Valid' -or -not $_.TimeStamperCertificate }
          if ($lose) {
            $lose | Format-Table Path, Status, StatusMessage -AutoSize | Out-String | Write-Host
            Write-Error "Nisu sve datoteke ispravno potpisane s vremenskim žigom."
            exit 1
          }
          Write-Host "Potpisano i provjereno: $($datoteke.Count) datoteka."

      # Potpis mijenja sadržaj exe-a, pa se SHA256SUMS iz koraka pakiranja ponovno računa.
      - name: SHA256SUMS nakon potpisa
        if: env.POTPIS == 'true'
        shell: bash
        run: (cd out && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS)

      - name: Upload portable exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wips-podrska-windows-x64
          path: ./out
          if-no-files-found: error

      - name: Upload unpacked build (for debugging)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wips-podrska-windows-x64-unpacked
          path: ./rustdesk
          retention-days: 7
