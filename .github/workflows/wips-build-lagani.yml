# WiPS korisnička verzija (lagani klijent, wips/LAGANI.md): Rust jezgra RustDeska bez Fluttera + Win32 prozori
# iz wips/lagani/. Gradi se s korisničkom varijantom (wips/varijante/korisnik.env) i istim patchevima kao Flutter
# build, ali bez Fluttera, bridgea i TopMostWindow-a. Rezultat je jedan exe (WiPSPodrska.exe) koji se pokreće bez
# raspakiravanja. Tehničarska verzija ostaje na Flutteru (wips-build-windows.yml).
# Potpis: isti Azure Artifact Signing i isto okruženje "release" kao wips-build-windows.yml (postavljanje opisano
# tamo); preskače se dok repo nema varijablu ARTIFACT_SIGNING_ACCOUNT.
name: WiPS korisnička verzija - lagana (Windows x64)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      hwcodec:
        description: "Ugradi hardverske kodeke (--features hwcodec,vram); veći exe"
        type: boolean
        default: false

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  # Isti vcpkg cache kao wips-build-windows.yml (ključ ovisi o vcpkg.json i res/vcpkg/**).
  VCPKG_BINARY_SOURCES: "clear;files,C:/vcpkg-bincache,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

permissions:
  contents: read

jobs:
  build-lagani-x64:
    runs-on: windows-2022
    environment: release # uz njega je vezan federated credential u Azureu; dopušta samo main i tagove v*
    permissions:
      contents: read
      id-token: write # OIDC prijava u Azure
    env:
      POTPIS: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply WiPS patches (korisnik)
        shell: bash
        run: bash wips/apply-patches.sh korisnik

      # Instalacija i servis traže exe s imenom aplikacije (vidi wips-build-windows.yml).
      - name: Exe name
        shell: bash
        run: |
          app=$(sed -n 's/^WIPS_APP_NAME=//p' wips/varijante/korisnik.env | tr -d '\r')
          test -n "$app"
          echo "EXE_NAME=$app" >> "$GITHUB_ENV"
          echo "EXE_NAME=$app"

      # Zakrpa 0001 daje WiPS metapodatke Flutter runneru i portable omotaču; ovaj exe gradi root crate
      # (build.rs, winres iz [package.metadata.winres]), pa mu se izdavač i izvorni naziv upisuju ovdje.
      - name: Metapodaci exe-a
        shell: bash
        run: |
          company=$(sed -n 's/^WIPS_COMPANY=//p' wips/server.env | tr -d '\r')
          test -n "$company"
          grep -q '^OriginalFilename = "rustdesk.exe"' Cargo.toml
          sed -i "s/^OriginalFilename = \"rustdesk.exe\"/OriginalFilename = \"${EXE_NAME}.exe\"\nInternalName = \"${EXE_NAME}\"\nCompanyName = \"${company}\"/" Cargo.toml
          sed -n '/^\[package.metadata.winres\]/,/^$/p' Cargo.toml
          grep -q "^CompanyName = \"${company}\"" Cargo.toml

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-lagani

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Restore vcpkg binary cache
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: C:/vcpkg-bincache
          key: vcpkg-bin-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**') }}
          restore-keys: |
            vcpkg-bin-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          mkdir -p /c/vcpkg-bincache
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "$f:"; cat "$f"; done
            exit 1
          fi

      # Samo bin "rustdesk" (src/main.rs): bez --bin cargo bi gradio i librustdesk.dll, koji ovdje nije potreban.
      # --locked: nove ovisnosti nema (winapi dobiva samo dodatne feature-e), pa Cargo.lock ostaje isti.
      - name: Build
        shell: bash
        run: |
          features=lagani
          if [ "${{ inputs.hwcodec }}" = "true" ]; then features="$features,hwcodec,vram"; fi
          echo "features: $features"
          cargo build --locked --release --features "$features" --bin rustdesk
          mkdir -p out
          cp target/release/rustdesk.exe "out/${EXE_NAME}.exe"

      - name: Prijava u Azure (OIDC, bez tajni)
        if: env.POTPIS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Potpis exe-a
        if: env.POTPIS == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          # Bez vremenskog žiga potpis prestaje vrijediti s certifikatom, a on traje oko 3 dana.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Provjera potpisa i vremenskog žiga
        if: env.POTPIS == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "out\$env:EXE_NAME.exe"
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
            $sig | Format-List Path, Status, StatusMessage | Out-String | Write-Host
            Write-Error "Exe nije ispravno potpisan s vremenskim žigom."
            exit 1
          }
          Write-Host "Potpisano: $($sig.SignerCertificate.Subject)"

      - name: Veličina i ovisnosti exe-a
        shell: pwsh
        run: |
          $exe = Get-Item "out\$env:EXE_NAME.exe"
          "{0}: {1:N1} MB ({2:N0} B)" -f $exe.Name, ($exe.Length / 1MB), $exe.Length
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents $exe.FullName | Select-String -Pattern '\.dll' }
          (Get-Item "out\$env:EXE_NAME.exe").VersionInfo | Format-List ProductName, FileDescription, FileVersion, CompanyName, OriginalFilename, InternalName
          (Get-ChildItem out | ForEach-Object { "{0} {1}" -f $_.Length, $_.Name }) | Set-Content out\VELICINA.txt

      - name: SHA256SUMS
        shell: bash
        run: (cd out && sha256sum *.exe > SHA256SUMS && cat SHA256SUMS)

      - name: Upload exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wips-podrska-korisnik-windows-x64${{ inputs.hwcodec && '-hwcodec' || '' }}
          path: ./out
          if-no-files-found: error
